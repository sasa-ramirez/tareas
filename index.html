<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tareas · Samuel Bonivento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root { --bg: #f3f5f6; --surface: #ffffff; --ink: #18222a; --muted: #5d6b75; --line: #cfd8de; --a1: #1f5f8b; --a2: #2c6a4c; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1418; --surface: #182128; --ink: #e5ecf0; --muted: #98a8b3; --line: #2f3e48; --a1: #6db3e3; --a2: #6fcf9d; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif; font-size: 16.5px; }
main { max-width: 640px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
h1 { font-family: "Archivo", Arial, sans-serif; font-weight: 800; font-size: 34px; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 20px; }
a.item { display: block; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 10px; padding: 16px; margin-bottom: 12px; color: var(--ink); text-decoration: none; }
a.item b { display: block; font-family: "Archivo", Arial, sans-serif; font-weight: 600; font-size: 19px; color: var(--c); }
a.item span { color: var(--muted); font-size: 15px; }
a.item:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Mis páginas de estudio</h1>
  <p>Samuel Bonivento · Ingeniería de Sistemas, Uniguajira</p>
  <a class="item" href="pert/" style="--c: var(--a1)"><b>Ruta Crítica PERT/CPM</b><span>Investigación de Operaciones · red de flechas, T1 · T2 · TH, ejercicios con corrección</span></a>
  <a class="item" href="ingles/" style="--c: var(--a2)"><b>Speaking Challenge</b><span>Inglés · My Life Experiences: frases con audio, 8 tarjetas, gramática y simulacro</span></a>
</main>
</body>
</html>
